version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    # godox intentionally disabled: the previous config excluded TODO|FIXME
    # sources entirely, which neutered the linter; TODO tracking happens in
    # the issue tracker, not via lint.
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    # gosmopolitan intentionally disabled: agent prompt templates
    # (internal/prompt) and Feishu domain strings are Chinese by
    # design (ported from AgentLoop).
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: use os or io package instead
    dogsled:
      max-blank-identifiers: 2
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    exhaustruct:
      exclude:
        - testing\.T
    forbidigo:
      forbid:
        - pattern: ^print.*$
          msg: use logging instead
        - pattern: ^fmt\.Print.*$
          msg: use logging instead
    funlen:
      lines: 120
      statements: 60
    gocognit:
      min-complexity: 90
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
    gocyclo:
      min-complexity: 25
    godot:
      scope: declarations
      capital: true
    gomoddirectives:
      replace-local: true
    gomodguard:
      blocked:
        modules:
          - github.com/pkg/errors:
              recommendations:
                - errors
                - fmt
    gosec:
      excludes:
        - G204
        - G404
    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
    lll:
      line-length: 120
      tab-width: 4
    maintidx:
      under: 20
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "4"
        - "8"
        - "10"
        - "64"
        - "100"
        - "1024"
      ignored-functions:
        - os.MkdirAll
        - os.OpenFile
        - os.WriteFile
    nakedret:
      max-func-lines: 30
    nestif:
      min-complexity: 12
    nlreturn:
      block-size: 2
    paralleltest:
      ignore-missing: true
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
          disabled: false
        - name: package-comments
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    tagliatelle:
      case:
        rules:
          avro: snake
          bson: camel
          json: snake
          mapstructure: kebab
          xml: camel
          yaml: snake
    testpackage:
      skip-regexp: (export|internal)_test\.go
    varnamelen:
      min-name-length: 2
      ignore-names:
        - err
        - i
        - j
        - k
        - v
        - id
        - ok
      ignore-decls:
        - t testing.T
        - e error
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
      ignore-package-globs:
        - github.com/JackDrogon/Cogito/*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
          - dupl
          - err113
          - errcheck
          - exhaustive
          - exhaustruct
          - forbidigo
          - forcetypeassert
          - funlen
          - gochecknoglobals
          - gochecknoinits
          - gocognit
          - goconst
          - gocritic
          - gocyclo
          - gosec
          - ireturn
          - lll
          - maintidx
          - mnd
          - nlreturn
          - noctx
          - nonamedreturns
          - paralleltest
          - testpackage
          - tparallel
          - unparam
          - varnamelen
          - wrapcheck
          - wsl_v5
        path: _test\.go
      - linters:
          - goprintffuncname
        path: _test\.go
      - linters:
          - perfsprint
        path: _test\.go
        text: use of `fmt.Sprintf`
      - linters:
          - forbidigo
        path: _test\.go
        text: use of `fmt.Print
      - linters:
          - gocritic
        text: hugeParam
      - linters:
          - gocritic
        text: unnamedResult
      - linters:
          - wrapcheck
        text: error returned from external package
      - linters:
          - wrapcheck
        text: error returned from interface method
      - linters:
          - gosec
        text: G204
      - linters:
          - gosec
        text: G404
      - linters:
          - unparam
        text: always receives
      - linters:
          - err113
        text: do not define dynamic errors
      - linters:
          - varnamelen
        text: parameter name '.+' is too short
      - linters:
          - ireturn
        text: returns interface
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - forbidigo
          - gochecknoglobals
          - gochecknoinits
        path: cmd/
      - linters:
          - gochecknoglobals
        path: internal/version/
      - linters:
          - gochecknoglobals
          - gochecknoinits
        path: internal/provider/
      - linters:
          - forbidigo
          - gochecknoglobals
        path: internal/app/
      - linters:
          - gochecknoglobals
        path: internal/runtime/
      - linters:
          - gochecknoglobals
        path: internal/store/
      - linters:
          - gochecknoglobals
        path: internal/task/
      - linters:
          - errcheck
        text: Error return value.*is not checked
        source: _, _ =
      - linters:
          - funlen
        path: internal/runtime/state_machine\.go
      - linters:
          - exhaustive
        path: internal/runtime/state_machine\.go
      - linters:
          - staticcheck
        text: 'SA9003:'
      - linters:
          - lll
        path: internal/runtime/state_machine\.go
      - linters:
          - lll
        path: internal/workflow/
      - linters:
          - lll
        path: internal/provider/
      - linters:
          - lll
        path: internal/prompt/
      - linters:
          - lll
        path: internal/app/
      - linters:
          - varnamelen
        text: variable name 'r' is too short
      - linters:
          - musttag
        path: internal/workflow/persist\.go
      - linters:
          - tagliatelle
        path: internal/workflow/model\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - ref/tmp
      - .*_generated\.go$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/JackDrogon/Cogito)
      custom-order: true
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
